name: ci
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m compileall -q src
      - name: ast parse
        run: |
          python -c "import ast,pathlib; files=list(pathlib.Path('src').rglob('*.py')); [ast.parse(p.read_text(encoding='utf-8')) for p in files]; print('syntax ok:', len(files), 'files')"
